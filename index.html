<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="game-container">
      <h1 id="game-title">Rock, Paper, Scissors</h1>
      <div id="results-container">
        <div class="results-card">
          <div id="human-card" class="result-img"></div>
          <div class="score-board">Score: <span id="human-score">0</span></div>
        </div>
        <div id="vrs-tag">Vrs</div>
        <div class="results-card">
          <div id="computer-card" class="result-img"></div>
          <div class="score-board">
            Score: <span id="computer-score">0</span>
          </div>
        </div>
      </div>
      <div id="game-controls">
        <button id="rock">
          <img src="./images/cartoon-rock.png" alt="Rock" class="btn-img" />
        </button>
        <button id="paper">
          <img src="./images/cartoon-paper.png" alt="Paper" class="btn-img" />
        </button>
        <button id="scissors">
          <img
            src="./images/cartoon-scissors.png"
            alt="Scissors"
            class="btn-img"
          />
        </button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
