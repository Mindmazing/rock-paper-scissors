<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="game-container">
      <h1>Rock, Paper, Scissors</h1>
      <div id="results-container">
        <div class="results-card" id="human-card"></div>
        <div id="vrs-tag">Vrs</div>
        <div class="results-card" id="computer-card"></div>
      </div>
      <div id="game-controls">
        <button id="rock-btn">
          <img src="./images/cartoon-rock.png" alt="Rock" class="btn-img" />
        </button>
        <button id="paper-btn">
          <img src="./images/cartoon-paper.png" alt="Paper" class="btn-img" />
        </button>
        <button id="scissors-btn">
          <img
            src="./images/cartoon-scissors.png"
            alt="Scissors"
            class="btn-img"
          />
        </button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
